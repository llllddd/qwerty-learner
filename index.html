<!DOCTYPE html>

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />

    <title>Qwerty Learner - 自定义版</title>

    <meta name="description" content="Qwerty Learner 个人版 - 专为键盘工作者设计的英语学习软件。" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#818CF8" />

    <script>
      // Dark mode init (保留夜间模式检测)
      try {
        if (
          ('state' in localStorage && JSON.parse(localStorage.state).darkMode) ||
          (!('state' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-10d1b4f8.js"></script>
    <link rel="stylesheet" href="./assets/index-4b7aebb9.css">

      <div>You need to enable JavaScript to run QWERTY Learner.</div>
    </noscript>
    <div id="root"></div>
    
  </body>
